{% extends "base.html" %}

{% block title %}Formulario de Cliente | AutoRent{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card shadow-sm">
            <div class="card-body">

                <h3 class="fw-bold mb-4">
                    {% if cliente %}
                        Editar cliente
                    {% else %}
                        Registrar nuevo cliente
                    {% endif %}
                </h3>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text" name="nombres"
                               class="form-control"
                               value="{{ cliente.nombres if cliente else '' }}"
                               required maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text" name="apellidos"
                               class="form-control"
                               value="{{ cliente.apellidos if cliente else '' }}"
                               required maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text" name="dni"
                               class="form-control"
                               value="{{ cliente.dni if cliente else '' }}"
                               pattern="[0-9]{8}" minlength="8" maxlength="8"
                               inputmode="numeric"
                               title="Ingrese exactamente 8 digitos"
                               required>
                        <div class="form-text">
                            El DNI debe tener exactamente 8 digitos.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Telefono</label>
                        <input type="tel" name="telefono"
                               class="form-control"
                               value="{{ cliente.telefono if cliente else '' }}"
                               required maxlength="20">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        {% if cliente %}Actualizar cliente{% else %}Guardar cliente{% endif %}
                    </button>

                    <a href="{{ url_for('listar_clientes') }}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
