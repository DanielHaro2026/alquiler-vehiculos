{% extends "base.html" %}

{% block title %}Formulario de Vehiculo | AutoRent{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card shadow-sm">
            <div class="card-body">

                <h3 class="fw-bold mb-4">
                    {% if vehiculo %}
                        Editar vehiculo
                    {% else %}
                        Registrar nuevo vehiculo
                    {% endif %}
                </h3>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Marca</label>
                        <input type="text" name="marca" class="form-control"
                               value="{{ vehiculo.marca if vehiculo else '' }}"
                               required maxlength="60">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Modelo</label>
                        <input type="text" name="modelo" class="form-control"
                               value="{{ vehiculo.modelo if vehiculo else '' }}"
                               required maxlength="60">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Placa</label>
                        <input type="text" name="placa" class="form-control"
                               value="{{ vehiculo.placa if vehiculo else '' }}"
                               required maxlength="15">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Precio por dia (S/)</label>
                        <input type="number" name="precio_dia"
                               class="form-control" min="0.01" step="0.01"
                               value="{{ vehiculo.precio_dia if vehiculo else '' }}"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        {% if vehiculo %}Actualizar{% else %}Guardar vehiculo{% endif %}
                    </button>

                    <a href="{{ url_for('listar_vehiculos') }}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
